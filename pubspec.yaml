name: acanthis
description: Acanthis is an easy-to-use validation library for Dart and Flutter.
version: 2.0.0
homepage: https://acanthis.dev
documentation: https://acanthis.dev/introduction.html
repository: https://github.com/avesbox/acanthis
funding:
  - https://github.com/sponsors/francescovallone

topics:
  - validation
  - dart
  - validation-form
  - validators
  - zod

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  email_validator: ^3.0.0
  crypto: ^3.0.7
  meta: ^1.19.0
  nanoid2: ^2.1.0
  
dev_dependencies:
  lints: ^6.0.0
  test: ^1.28.0
